# Nginx di depan Gunicorn. Salin ke /etc/nginx/conf.d/biochain.conf
# Lapisan pertama admission control: batasi laju per IP sebelum request menyentuh Python.

limit_req_zone  $binary_remote_addr zone=api:20m   rate=20r/s;
limit_req_zone  $binary_remote_addr zone=login:10m rate=10r/m;
limit_conn_zone $binary_remote_addr zone=perip:10m;

upstream biochain_api {
    server 127.0.0.1:8000;
    keepalive 64;                       # pakai ulang koneksi upstream (hemat handshake di lonjakan)
}

server {
    listen 80;
    server_name _;
    client_max_body_size 2m;

    location = /api/v1/auth/login {
        limit_req zone=login burst=5 nodelay;
        limit_req_status 429;
        include /etc/nginx/biochain_proxy.conf;
    }

    location /api/ {
        limit_req  zone=api burst=40 nodelay;
        limit_conn perip 20;
        limit_req_status 429;
        include /etc/nginx/biochain_proxy.conf;
    }

    location / {
        include /etc/nginx/biochain_proxy.conf;
    }
}

