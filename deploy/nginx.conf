# Nginx di depan Gunicorn. Salin ke /etc/nginx/conf.d/biochain.conf, ganti biochain.example.id.
# Lapisan pertama admission control: batasi laju per IP sebelum request menyentuh Python.
#
# TLS (F4): kamera QR, GPS, Wake Lock & crypto.randomUUID HANYA jalan di HTTPS.
#   sudo certbot certonly --webroot -w /var/www/certbot -d biochain.example.id
#   (sertifikat diperpanjang otomatis oleh timer certbot; reload nginx di deploy hook)
# Set juga di .env: CORS_ORIGINS=https://biochain.example.id

limit_req_zone  $binary_remote_addr zone=api:20m   rate=20r/s;
limit_req_zone  $binary_remote_addr zone=login:10m rate=10r/m;
limit_conn_zone $binary_remote_addr zone=perip:10m;

upstream biochain_api {
    server 127.0.0.1:8000;
    keepalive 64;                       # pakai ulang koneksi upstream (hemat handshake di lonjakan)
}

# HTTP → HTTPS (kecuali tantangan ACME untuk certbot)
server {
    listen 80;
    listen [::]:80;
    server_name biochain.example.id;

    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name biochain.example.id;

    ssl_certificate     /etc/letsencrypt/live/biochain.example.id/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/biochain.example.id/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:TLS:10m;
    ssl_session_timeout 1d;
    ssl_stapling on;
    ssl_stapling_verify on;

    # Header keamanan di file include agar location yang punya add_header sendiri (mis. /sw.js) tetap membawanya
    # (nginx TIDAK mewarisi add_header ke location yang mendefinisikan add_header).
    include /etc/nginx/biochain_security_headers.conf;

    gzip on;                            # index.html ±220 KB → ±50 KB (F15)
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    client_max_body_size 2m;

    location = /api/v1/auth/login {
        limit_req zone=login burst=5 nodelay;
        limit_req_status 429;
        include /etc/nginx/biochain_proxy.conf;
    }

    # Foto bukti: batas endpoint 5 MB (app/routers/uploads.py); klien sudah mengompres ±200–400 KB
    location /api/v1/uploads {
        client_max_body_size 6m;
        limit_req  zone=api burst=10 nodelay;
        limit_req_status 429;
        include /etc/nginx/biochain_proxy.conf;
    }

    location /api/ {
        limit_req  zone=api burst=40 nodelay;
        limit_conn perip 20;
        limit_req_status 429;
        include /etc/nginx/biochain_proxy.conf;
    }

    # Service worker harus selalu segar agar pembaruan versi cache (biochain-shell-vN) cepat sampai
    location = /sw.js {
        include /etc/nginx/biochain_security_headers.conf;
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/biochain_proxy.conf;
    }

    location / {
        include /etc/nginx/biochain_proxy.conf;
    }
}

